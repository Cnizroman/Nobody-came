    <style>
        /* Финальное оформление окна пароля третьей книги */
        .password-box .close-btn {
            position: absolute;

            width: 54px;

            box-shadow: 0 0 25px rgba(var(--accent-rgb), .08), inset 0 0 20px rgba(var(--accent-rgb), .04);

        .password-box .sub {
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;

        /* Финальное голосовое сообщение */
        .final-voice { margin:28px auto 34px; max-width:680px; padding:18px 20px 16px; border:1px solid rgba(166,123,196,.18); border-radius:18px; background:linear-gradient(135deg,rgba(22,18,27,.88),rgba(10,9,13,.94)); box-shadow:0 18px 45px rgba(0,0,0,.28),inset 0 0 30px rgba(166,123,196,.025); }
        .final-voice-head { display:flex; align-items:center; gap:12px; margin-bottom:15px; }
        .final-voice-icon { width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(166,123,196,.34);color:#a67bc4;font-size:11px;box-shadow:0 0 18px rgba(166,123,196,.08); }
        .final-voice-title { color:#cfc7d7;font:15px/1.2 'Playfair Display',serif;letter-spacing:.03em; }
        .final-voice-meta { margin-top:3px;color:#625b69;font:11px/1.3 'EB Garamond',serif;letter-spacing:.04em; }
        .final-voice-player { display:flex;align-items:center;gap:13px; }
        .final-voice-play { flex:0 0 38px;width:38px;height:38px;border-radius:50%;padding:0;border:1px solid rgba(166,123,196,.34);background:rgba(166,123,196,.08);color:#b694d0;font-size:13px;cursor:pointer;transition:.25s ease; }
        .final-voice-play:hover { background:rgba(166,123,196,.15);box-shadow:0 0 20px rgba(166,123,196,.12);transform:scale(1.04); }
        .final-voice-track-wrap { flex:1;min-width:0; }
        .final-voice-wave { height:31px;display:flex;align-items:center;gap:3px;cursor:pointer; }
        .final-voice-wave i { display:block;flex:1;max-width:4px;min-width:2px;height:var(--h,13px);border-radius:3px;background:rgba(166,123,196,.34);transition:background .15s ease; }
        .final-voice-wave i:nth-child(3n){--h:21px}.final-voice-wave i:nth-child(4n){--h:10px}.final-voice-wave i:nth-child(5n){--h:25px}.final-voice-wave i:nth-child(7n){--h:17px}.final-voice-wave i:nth-child(8n){--h:8px}.final-voice-wave i:nth-child(11n){--h:22px}.final-voice-wave i:nth-child(13n){--h:14px}.final-voice-wave i:nth-child(17n){--h:27px}.final-voice-wave i:nth-child(19n){--h:11px}
        .final-voice-wave i.active { background:#a67bc4; }
        .final-voice-time { display:flex;justify-content:space-between;color:#55505b;font:11px/1 'EB Garamond',serif;margin-top:2px; }
        .final-voice-audio { display:none; }
        .final-voice-status { margin-top:11px;color:#514a58;font:italic 12px/1.4 'EB Garamond',serif; }
        .message-unfinished { max-height:0;overflow:hidden;opacity:0;margin:0 auto;text-align:center;color:#6c6274;font:italic 14px/1.5 'EB Garamond',serif;letter-spacing:.03em;transition:max-height 1.2s ease,opacity 1.2s ease,margin .9s ease; }
        .message-unfinished.visible { max-height:80px;opacity:1;margin:24px auto 40px; }
        @media(max-width:600px){.final-voice{padding:16px 15px;border-radius:15px}.final-voice-title{font-size:14px}.final-voice-wave{gap:2px}.final-voice-wave i{max-width:3px}.final-voice-status{font-size:11px}}

    <script>
        // ============================================================
        //  ЗАЩИТА ПАРОЛЕМ
        //  Текст книги в странице хранится только в зашифрованном виде
        //  (AES-256-GCM, ключ из пароля через PBKDF2). Без верного пароля
        //  прочитать его нельзя ни на экране, ни в исходном коде.
        // ============================================================
        (function() {
            const o = document.getElementById('passwordOverlay');
            const c = document.getElementById('book-content');
            const body = document.getElementById('book-body');
            const i = document.getElementById('passwordInput');
            const e = document.getElementById('errorMsg');
            const b = document.getElementById('unlockBtn');
            const x = document.getElementById('closePasswordBtn');
            const bx = document.getElementById('passwordBox');
            const data = JSON.parse(document.getElementById('locked-data').textContent);

            const unb64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));

            async function decrypt(b64, password) {
                const raw = unb64(b64);
                const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
                const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
                const key = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt, iterations: data.i, hash: 'SHA-256' },
                    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
                const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
                return new TextDecoder().decode(plain);
            }

            function fail(text) {
                e.textContent = text;
                bx.classList.add('shake');
                setTimeout(() => bx.classList.remove('shake'), 400);
                i.value = '';
                i.focus();
            }

            function open(html) {
                body.innerHTML = html;
                o.classList.add('hidden');
                c.classList.add('visible');
                e.textContent = '';
                i.value = '';
                initFinalVoice(c);
                if (window.NobodyReviews && window.NobodyReviews.mount) window.NobodyReviews.mount();
                document.dispatchEvent(new CustomEvent('nobody:content-ready'));
                window.scrollTo(0, 0);
            }

            let busy = false;
            async function check() {
                if (busy) return;
                const value = i.value.trim().toLowerCase().normalize('NFC');
                if (!value) return;
                if (!(window.crypto && crypto.subtle)) {
                    fail('Браузер не поддерживает расшифровку. Откройте сайт по https в современном браузере.');
                    return;
                }
                busy = true;
                b.disabled = true;
                const label = b.textContent;
                b.textContent = 'Открываю…';
                e.textContent = '';
                try {
                    // Пароль подходит либо к полной версии, либо к версии «с начала».
                    for (const key of ['n', 'b']) {
                        try { open(await decrypt(data[key], value)); return; }
                        catch (err) { /* неверный пароль для этого варианта — пробуем следующий */ }
                    }
                    fail('❌ Неверный пароль.');
                } finally {
                    busy = false;
                    b.disabled = false;
                    b.textContent = label;
                }
            }

            b.addEventListener('click', check);
            i.addEventListener('keydown', (ev) => {
                if (ev.key === 'Enter') {
                    ev.preventDefault();
                    check();
                }
            });
            x.addEventListener('click', () => window.location.href = 'index.html');
            i.focus();
        })();

        // ============================================================
        //  ФИНАЛЬНОЕ ГОЛОСОВОЕ
        // ============================================================
        function initFinalVoice(root) {
            const scope = root || document;
            const box = scope.querySelector ? scope.querySelector('[data-final-voice]') : null;
            if (!box || box.dataset.ready === '1') return;
            box.dataset.ready = '1';
            const audio = box.querySelector('.final-voice-audio');
            const play = box.querySelector('.final-voice-play');
            const status = box.querySelector('.final-voice-status');
            const current = box.querySelector('.final-voice-current');
            const duration = box.querySelector('.final-voice-duration');
            const bars = [...box.querySelectorAll('.final-voice-wave i')];
            const unfinished = scope.querySelector('[data-message-unfinished]');
            const fmt = sec => { if (!Number.isFinite(sec)) return '0:00'; sec=Math.max(0,Math.floor(sec)); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); };
            const paint = () => { const ratio=audio.duration?audio.currentTime/audio.duration:0; bars.forEach((bar,idx)=>bar.classList.toggle('active',idx/bars.length<ratio)); current.textContent=fmt(audio.currentTime); };
            play.addEventListener('click',()=>{
                if(audio.paused){ audio.play().then(()=>{play.textContent='❚❚';play.setAttribute('aria-label','Поставить голосовое на паузу');status.textContent='идёт воспроизведение';}).catch(()=>{status.textContent='не удалось воспроизвести аудио';}); }
                else audio.pause();
            });
            audio.addEventListener('loadedmetadata',()=>duration.textContent=fmt(audio.duration));
            audio.addEventListener('timeupdate',paint);
            audio.addEventListener('pause',()=>{if(!audio.ended){play.textContent='▶';play.setAttribute('aria-label','Продолжить голосовое');status.textContent='приостановлено';}});
            audio.addEventListener('ended',()=>{play.textContent='↻';play.setAttribute('aria-label','Прослушать голосовое ещё раз');status.textContent='сообщение завершено';paint();if(unfinished) requestAnimationFrame(()=>unfinished.classList.add('visible'));});
            bars.forEach((bar,idx)=>bar.addEventListener('click',()=>{if(audio.duration){audio.currentTime=audio.duration*(idx/bars.length);paint();}}));
            audio.addEventListener('error',()=>status.textContent='голосовое сейчас недоступно');
        }

        initFinalVoice(document);

        // ============================================================
        //  МЕРЦАЮЩИЕ ЗВЁЗДЫ
        // ============================================================
        (function() {
            const container = document.getElementById('starsContainer');
            if (!container) return;
            const count = 120;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 4 + 2;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                star.style.opacity = Math.random() * 0.6 + 0.2;
                container.appendChild(star);
            }
        })();
    </script>
